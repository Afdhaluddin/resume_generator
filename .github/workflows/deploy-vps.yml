name: Deploy to VPS

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            APP_DIR=~/resume-generator
            TMP_DIR=~/resume-generator-tmp
            GITHUB_REPO="Afdhaluddin/resume_generator"

            # Create app directory
            mkdir -p $APP_DIR
            cd $APP_DIR

            # Fix DNS if needed
            if ! nslookup github.com > /dev/null 2>&1; then
              echo "WARNING: DNS resolution failed. Adding Google DNS..."
              echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null || true
              echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf > /dev/null || true
            fi

            # --- Strategy: Always download fresh tarball ---
            # This avoids all git permission/ownership issues
            echo "Downloading fresh code..."
            mkdir -p $TMP_DIR
            cd $TMP_DIR
            curl -fsSL "https://github.com/$GITHUB_REPO/archive/refs/heads/main.tar.gz" -o main.tar.gz
            tar -xzf main.tar.gz --strip-components=1
            rm -f main.tar.gz

            # Preserve .env if it exists in the live dir
            if [ -f $APP_DIR/.env ]; then
              echo "Preserving existing .env..."
              cp $APP_DIR/.env $TMP_DIR/.env
            fi

            # Replace old code with new code
            # Use rsync if available, otherwise manual copy
            echo "Replacing application code..."
            rm -rf $APP_DIR
            mv $TMP_DIR $APP_DIR
            cd $APP_DIR

            # Ensure .env exists
            if [ ! -f .env ]; then
              echo "WARNING: .env not found. Creating from .env.example"
              cp .env.example .env
              echo "Please edit .env with your Stripe and SMTP credentials!"
            fi

            # Docker: check if deployer can run without sudo
            if docker ps > /dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
              DOCKER_CLEAN="docker image prune -f"
            else
              echo "WARNING: docker requires sudo. Trying sudo..."
              COMPOSE_CMD="sudo docker compose"
              DOCKER_CLEAN="sudo docker image prune -f"
            fi

            # Rebuild and restart
            $COMPOSE_CMD down || true
            $COMPOSE_CMD build --no-cache
            $COMPOSE_CMD up -d

            # Cleanup
            $DOCKER_CLEAN || true

            # Health check
            echo "Waiting for services to start..."
            sleep 20

            BACKEND_HEALTH=$(curl -sf http://localhost:8080/api/resume/check-limit && echo "OK" || echo "FAIL")
            FRONTEND_HEALTH=$(curl -sf http://localhost:80/ > /dev/null && echo "OK" || echo "FAIL")

            if [ "$BACKEND_HEALTH" = "OK" ] && [ "$FRONTEND_HEALTH" = "OK" ]; then
              echo "========================================"
              echo " Deployment successful!"
              echo "========================================"
              echo "Frontend: http://${{ secrets.VPS_HOST }}"
              echo "Backend:  http://${{ secrets.VPS_HOST }}:8080"
              echo "Admin:    http://${{ secrets.VPS_HOST }}/#admin"
              $COMPOSE_CMD ps
            else
              echo "ERROR: Health check failed!"
              $COMPOSE_CMD logs --tail 50
              exit 1
            fi
