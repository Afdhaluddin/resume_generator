name: Deploy to VPS

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            APP_DIR=~/resume-generator
            TIMESTAMP=$(date +%s)
            NEW_DIR=~/resume-generator-$TIMESTAMP
            GITHUB_REPO="Afdhaluddin/resume_generator"

            echo "=== ResumeForge Deploy ==="
            echo "Timestamp: $TIMESTAMP"
            echo "New dir: $NEW_DIR"

            # Fix DNS if needed
            if ! nslookup github.com > /dev/null 2>&1; then
              echo "WARNING: DNS resolution failed. Adding Google DNS..."
              echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null || true
              echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf > /dev/null || true
            fi

            # --- Download fresh code ---
            echo "[1/6] Downloading fresh code..."
            mkdir -p "$NEW_DIR"
            cd "$NEW_DIR"
            curl -fsSL "https://github.com/$GITHUB_REPO/archive/refs/heads/main.tar.gz" -o main.tar.gz
            tar -xzf main.tar.gz --strip-components=1
            rm -f main.tar.gz

            echo "Extracted files:"
            ls -la "$NEW_DIR" | head -20

            # Verify extraction
            if [ ! -f "$NEW_DIR/docker-compose.yml" ]; then
              echo "ERROR: tarball extraction failed - docker-compose.yml not found"
              exit 1
            fi

            # Preserve .env from current live directory
            if [ -f "$APP_DIR/.env" ]; then
              echo "[2/6] Preserving existing .env..."
              cp "$APP_DIR/.env" "$NEW_DIR/.env"
            fi

            # Determine docker compose command
            if docker ps > /dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            else
              echo "WARNING: docker requires sudo. Using sudo..."
              COMPOSE_CMD="sudo docker compose"
            fi

            # Stop running containers from old location
            echo "[3/6] Stopping current containers..."
            OLD_COMPOSE=""
            if [ -L "$APP_DIR" ]; then
              OLD_TARGET=$(readlink -f "$APP_DIR" 2>/dev/null || readlink "$APP_DIR" 2>/dev/null || echo "")
              if [ -n "$OLD_TARGET" ] && [ -f "$OLD_TARGET/docker-compose.yml" ]; then
                OLD_COMPOSE="$OLD_TARGET/docker-compose.yml"
              fi
            elif [ -f "$APP_DIR/docker-compose.yml" ]; then
              OLD_COMPOSE="$APP_DIR/docker-compose.yml"
            fi

            if [ -n "$OLD_COMPOSE" ]; then
              echo "Stopping containers from: $OLD_COMPOSE"
              $COMPOSE_CMD -f "$OLD_COMPOSE" down || true
            else
              echo "No existing deployment found, skipping stop..."
            fi

            # Swap to new code
            echo "[4/6] Swapping to new code..."
            if [ -d "$APP_DIR" ] && [ ! -L "$APP_DIR" ]; then
              mv "$APP_DIR" "$APP_DIR.backup-$TIMESTAMP"
              echo "Moved old directory to backup"
            elif [ -L "$APP_DIR" ]; then
              rm -f "$APP_DIR"
            fi
            ln -s "$NEW_DIR" "$APP_DIR"
            echo "Symlink created: $APP_DIR -> $NEW_DIR"

            cd "$APP_DIR"

            # Ensure .env exists
            echo "[5/6] Setting up .env..."
            if [ ! -f .env ]; then
              if [ -f .env.example ]; then
                echo "Creating .env from .env.example"
                cp .env.example .env || true
              fi
              # If still no .env, create minimal one
              if [ ! -f .env ]; then
                echo "Creating minimal .env"
                cat > .env << 'ENVEOF'
# Stripe
STRIPE_SECRET_KEY=sk_test_your_key_here
STRIPE_PUBLISHABLE_KEY=pk_test_your_key_here
STRIPE_WEBHOOK_SECRET=whsec_your_secret_here
STRIPE_PRICE_ID=price_your_price_here

# Email (SMTP)
SMTP_HOST=smtp.gmail.com
SMTP_PORT=587
SMTP_USERNAME=your-email@gmail.com
SMTP_PASSWORD=your-app-password
EMAIL_FROM=noreply@resumeforge.app

# Admin
ADMIN_API_KEY=change-me-admin-key

# App
FREE_RESUME_LIMIT=2
ENVEOF
              fi
              echo "WARNING: Please edit .env with your actual credentials!"
            fi

            # Build and start
            echo "[6/6] Building and starting containers..."
            $COMPOSE_CMD build --no-cache
            $COMPOSE_CMD up -d

            # Cleanup
            docker image prune -f 2>/dev/null || sudo docker image prune -f 2>/dev/null || true
            ls -td ~/resume-generator-*/ 2>/dev/null | tail -n +3 | xargs -r rm -rf 2>/dev/null || true
            ls -td ~/resume-generator.backup-*/ 2>/dev/null | tail -n +3 | xargs -r rm -rf 2>/dev/null || true

            # Health check
            echo "Waiting for services..."
            sleep 20
            BACKEND=$(curl -sf http://localhost:8080/api/resume/check-limit && echo "OK" || echo "FAIL")
            FRONTEND=$(curl -sf http://localhost:80/ > /dev/null && echo "OK" || echo "FAIL")

            if [ "$BACKEND" = "OK" ] && [ "$FRONTEND" = "OK" ]; then
              echo "========================================"
              echo " Deployment successful!"
              echo "========================================"
              echo "Frontend: http://${{ secrets.VPS_HOST }}"
              echo "Backend:  http://${{ secrets.VPS_HOST }}:8080"
            else
              echo "ERROR: Health check failed!"
              $COMPOSE_CMD logs --tail 50
              exit 1
            fi
