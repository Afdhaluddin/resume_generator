name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            export VPS_HOST="${{ secrets.VPS_HOST }}"
            curl -fsSL "https://raw.githubusercontent.com/Afdhaluddin/resume_generator/main/scripts/deploy.sh" -o /tmp/deploy.sh
            bash /tmp/deploy.sh
            rm -f /tmp/deploy.sh
