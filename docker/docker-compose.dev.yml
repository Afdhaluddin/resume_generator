services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: resumegen-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - resumegen-net
    volumes:
      - ../backend/src:/app/src  # Hot reload for dev

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: resumegen-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - resumegen-net
    volumes:
      - ../frontend/src:/app/src  # Hot reload for dev

networks:
  resumegen-net:
    driver: bridge
