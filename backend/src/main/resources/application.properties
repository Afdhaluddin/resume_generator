spring.application.name=resume-generator
server.port=8080

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4173,http://localhost:8081

# Resume limits
resume.free-limit=2

# Stripe (test mode placeholders - replace with real keys)
stripe.secret-key=sk_test_replace_with_your_stripe_secret_key
stripe.webhook-secret=whsec_replace_with_your_webhook_secret
stripe.price-id=price_replace_with_your_price_id

# Frontend URL
app.frontend-url=http://localhost:8081

# SMTP / Email (optional - receipts work without this but won't send)
# Gmail example: spring.mail.host=smtp.gmail.com, spring.mail.port=587
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=your-email@example.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
