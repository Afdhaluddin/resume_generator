server.port=8080

# CORS
cors.allowed-origins=http://localhost,http://localhost:8081,http://localhost:80

# Resume limits
resume.free-limit=2

# Stripe (set via environment variables in production)
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.price-id=${STRIPE_PRICE_ID:price_placeholder}

# Frontend URL
app.frontend-url=${APP_FRONTEND_URL:http://localhost:8081}

# SMTP / Email
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}
